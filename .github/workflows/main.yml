name: Enviar Lista Diaria

on:
  schedule:
    # 11:00 UTC é 08:00 no horário de Brasília
    - cron: '0 11 * * *'
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Baixando o codigo
        uses: actions/checkout@v3

      - name: Instalando o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalando bibliotecas
        run: pip install requests python-telegram-bot

      - name: Executando o Bot
        run: python "MEU BOT.py"
